<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>전화번호 입력받아서 문자 보내기</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">macOS Messages Launcher</p>
        <h1>전화번호 입력받아서 문자 보내기</h1>
        <p class="intro">
          수신자를 최대 20명까지 입력하면 Mac의 메시지 앱 작성 화면을 엽니다.
          실제 SMS 전송은 iPhone 문자 전달이 연동된 환경에서 동작합니다.
        </p>

        <form id="sms-form" class="form">
          <label class="field">
            <span>수신자 전화번호</span>
            <textarea
              id="phone-list"
              name="phone-list"
              rows="5"
              placeholder="01012345678&#10;01098765432&#10;01055554444"
              required
            ></textarea>
            <small class="field-note">줄바꿈이나 쉼표로 구분해서 최대 20명까지 입력</small>
          </label>

          <label class="field">
            <span>문자 내용</span>
            <textarea
              id="message"
              name="message"
              rows="6"
              placeholder="보낼 문구를 입력하세요"
              required
            ></textarea>
          </label>

          <div class="actions">
            <button type="submit" class="primary">첫 번째 메시지 열기</button>
            <button type="button" id="next-link" class="secondary" hidden>다음 수신자 열기</button>
            <button type="button" id="copy-link" class="secondary">현재 수신자 링크 복사</button>
          </div>
        </form>

        <div id="status" class="status" aria-live="polite"></div>
        <div class="summary">
          <strong id="recipient-count">0명</strong>
          <span>유효한 수신자</span>
        </div>
        <div class="summary">
          <strong id="queue-progress">0 / 0</strong>
          <span>열린 작성창 진행</span>
        </div>
        <p class="hint">
          이 앱은 외부 서버와 통신하지 않고, <code>127.0.0.1</code> 에서만 실행됩니다.
          여러 명에게 보낼 때는 각 수신자 작성창을 순서대로 엽니다. 저장 안 된 번호도 인식되도록 번호는 숫자만 넣거나, 국제번호는 맨 앞에 <code>+</code>만 사용하세요.
        </p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
